<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Orders & Delivery Pipeline</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial, sans-serif;
    background:#f4f7fb;
    color:#172033;
}

.container{
    max-width:1250px;
    margin:auto;
    padding:35px 25px;
}


/* ================= HEADER ================= */

.header{
    background:white;
    border-radius:28px;
    padding:30px 35px;
    border:1px solid #e5e9ef;
    margin-bottom:22px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:25px;
}

.left h1{
    font-size:38px;
    margin-top:12px;
}

.badge{
    display:inline-block;
    background:#d8f8e9;
    color:#147b5b;
    padding:8px 17px;
    border-radius:20px;
    font-weight:bold;
}

.version{
    color:#9aa4b2;
    margin-left:8px;
}

.subtitle{
    color:#697586;
    font-size:17px;
    margin-top:8px;
}

.webhook{
    background:#e9fbf3;
    border:1px solid #c8efdd;
    color:#19765b;
    padding:16px 20px;
    border-radius:18px;
    min-width:260px;
}


/* ================= STATS ================= */

.stats{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:18px;
    margin-bottom:22px;
}

.stat{
    background:white;
    border-radius:22px;
    padding:25px;
    border:1px solid #e3e8ef;
    min-height:135px;
}

.stat-title{
    font-size:14px;
    font-weight:bold;
    letter-spacing:1px;
}

.number{
    font-size:38px;
    font-weight:bold;
    margin-top:10px;
}

.total{
    background:#eef4ff;
    border-color:#d7e3ff;
}

.total .stat-title,
.total .number{
    color:#3267c5;
}

.pending{
    background:#fff8df;
    border-color:#f4e4a8;
}

.pending .stat-title,
.pending .number{
    color:#b67808;
}

.dispatched{
    background:#f5edff;
    border-color:#e2cff7;
}

.dispatched .stat-title,
.dispatched .number{
    color:#843bb9;
}

.delivered{
    background:#e9fbf4;
    border-color:#c9efdf;
}

.delivered .stat-title,
.delivered .number{
    color:#168768;
}


/* ================= MENU ================= */

.menu-card{
    background:white;
    border-radius:22px;
    border:1px solid #e3e8ef;
    padding:12px 15px;
    margin-bottom:20px;

    display:flex;
    align-items:center;
    gap:8px;

    overflow-x:auto;
}

.menu-btn{
    border:none;
    background:transparent;
    color:#536072;

    padding:14px 22px;
    border-radius:17px;

    font-size:16px;
    font-weight:bold;
    white-space:nowrap;

    cursor:pointer;
}

.menu-btn:hover{
    background:#f1f4f8;
}

.menu-btn.active{
    background:#14213a;
    color:white;
}


/* ================= SEARCH ================= */

.search{
    background:white;
    padding:18px;
    border-radius:20px;
    border:1px solid #e3e8ef;
    margin-bottom:20px;
}

.search input{
    width:100%;
    padding:15px 18px;
    border-radius:15px;
    border:1px solid #e1e6ec;
    background:#f8fafc;
    font-size:16px;
    outline:none;
}


/* ================= ORDER ================= */

.order{
    background:white;
    border:1px solid #e2e7ed;
    border-radius:25px;
    padding:28px;
    margin-bottom:20px;
}

.order-top{
    display:flex;
    align-items:center;
    gap:12px;
    flex-wrap:wrap;
}

.order-id{
    font-size:25px;
    font-weight:bold;
}

.status{
    padding:8px 16px;
    border-radius:20px;
    font-weight:bold;
}

.status.Pending{
    background:#fff1c2;
    color:#a76b00;
}

.status.Confirmed{
    background:#dcecff;
    color:#3569aa;
}

.status.Dispatched{
    background:#f0dcff;
    color:#833ab5;
}

.status.Delivered{
    background:#d7f8e8;
    color:#168667;
}

.status.Cancelled{
    background:#ffe0e6;
    color:#a63754;
}

.time{
    color:#9aa5b2;
}

.buttons{
    display:flex;
    gap:10px;
    margin-top:18px;
    flex-wrap:wrap;
}

.btn{
    border:none;
    padding:12px 20px;
    border-radius:16px;
    font-size:15px;
    font-weight:bold;
    cursor:pointer;
}

.blue{
    background:#2868e8;
    color:white;
}

.purple{
    background:#9634df;
    color:white;
}

.green{
    background:#079b6c;
    color:white;
}

.black{
    background:#111827;
    color:white;
}

.gray{
    background:#eef2f6;
    color:#657184;
}

.details{
    border-top:1px solid #edf0f3;
    margin-top:25px;
    padding-top:22px;
}

.label{
    color:#9aa5b3;
    font-size:14px;
    font-weight:bold;
    letter-spacing:1px;
    margin-bottom:8px;
}

.name{
    font-size:21px;
    font-weight:bold;
}

.info{
    color:#697586;
    line-height:1.8;
    margin-top:5px;
}

.item{
    margin-top:20px;
    background:#f8fafc;
    border:1px solid #edf0f4;
    border-radius:17px;
    padding:17px;

    display:flex;
    justify-content:space-between;
    gap:15px;
}

.bill{
    margin-top:18px;
    background:#ecfcf6;
    border:1px solid #ccefe0;
    border-radius:18px;
    padding:20px;
}

.bill-price{
    font-size:30px;
    font-weight:bold;
    margin-top:5px;
}

.no-orders{
    background:white;
    padding:50px;
    text-align:center;
    border-radius:22px;
    color:#8994a3;
}


/* ================= MOBILE ================= */

@media(max-width:800px){

    .container{
        padding:18px 12px;
    }

    .header{
        flex-direction:column;
        align-items:flex-start;
    }

    .left h1{
        font-size:30px;
    }

    .webhook{
        width:100%;
    }

    .stats{
        grid-template-columns:repeat(2,1fr);
    }

}

@media(max-width:500px){

    .stats{
        grid-template-columns:1fr;
    }

    .order{
        padding:22px;
    }

}
</style>
</head>


<body>

<div class="container">


<!-- HEADER -->

<div class="header">

    <div class="left">

        <span class="badge">S-WBOE Engine</span>

        <span class="version">
            v2.4 Connected
        </span>

        <h1>
            Orders & Delivery Pipeline
        </h1>

        <p class="subtitle">
            Manage customer orders, track live shipping status,
            and send automated WhatsApp alerts.
        </p>

    </div>


    <div class="webhook">
        💬 <b>WhatsApp Webhook Active</b>
        <br>
        <small>
            Auto-pings triggered on status change
        </small>
    </div>

</div>



<!-- STATS -->

<div class="stats">

    <div class="stat total">
        <div class="stat-title">
            TOTAL ORDERS
        </div>

        <div class="number" id="total">
            5
        </div>
    </div>


    <div class="stat pending">
        <div class="stat-title">
            PENDING CONFIRMATION
        </div>

        <div class="number" id="pending">
            1
        </div>
    </div>


    <div class="stat dispatched">
        <div class="stat-title">
            DISPATCHED / IN-TRANSIT
        </div>

        <div class="number" id="dispatched">
            1
        </div>
    </div>


    <div class="stat delivered">
        <div class="stat-title">
            DELIVERED ORDERS
        </div>

        <div class="number" id="delivered">
            1
        </div>
    </div>

</div>



<!-- HORIZONTAL MENU -->

<div class="menu-card">

    <button class="menu-btn active"
        onclick="filterOrders('All',this)">
        All Orders
    </button>

    <button class="menu-btn"
        onclick="filterOrders('Pending',this)">
        Pending
    </button>

    <button class="menu-btn"
        onclick="filterOrders('Confirmed',this)">
        Confirmed
    </button>

    <button class="menu-btn"
        onclick="filterOrders('Dispatched',this)">
        Dispatched
    </button>

    <button class="menu-btn"
        onclick="filterOrders('Delivered',this)">
        Delivered
    </button>

    <button class="menu-btn"
        onclick="filterOrders('Cancelled',this)">
        Cancelled
    </button>

</div>



<!-- SEARCH -->

<div class="search">

    <input
        id="search"
        type="text"
        placeholder="🔍 Search Order ID, Name, Phone..."
        onkeyup="searchOrders()">

</div>



<!-- ORDERS -->

<div id="orders"></div>


</div>



<script>


let orders = [

{
    id:"ORD-1024",
    status:"Pending",
    time:"10 mins ago",
    name:"Ramesh Kumar",
    phone:"+91 98765 43210",
    address:"12, Cross Street, Peelamedu, Coimbatore - 641004",
    item:"1x Nike Air Zoom Running Shoes",
    price:1999,
    payment:"COD"
},

{
    id:"ORD-1023",
    status:"Confirmed",
    time:"1 hour ago",
    name:"Ananya Sharma",
    phone:"+91 98123 45678",
    address:"45, Gandhi Road, Adyar, Chennai - 600020",
    item:"1x Wireless Bluetooth Earbuds",
    price:1499,
    payment:"UPI (Paid)"
},

{
    id:"ORD-1022",
    status:"Dispatched",
    time:"3 hours ago",
    name:"Suresh Raina",
    phone:"+91 97890 12345",
    address:"88, Anna Nagar, Madurai - 625020",
    item:"1x Smart Watch Series 5 (Black)",
    price:4999,
    payment:"UPI (Paid)"
},

{
    id:"ORD-1021",
    status:"Delivered",
    time:"Yesterday",
    name:"Priya Patel",
    phone:"+91 96543 21098",
    address:"15, RS Puram, Coimbatore - 641002",
    item:"1x Vintage Denim Jacket",
    price:899,
    payment:"UPI (Paid)"
},

{
    id:"ORD-1020",
    status:"Cancelled",
    time:"2 days ago",
    name:"Karthik Raja",
    phone:"+91 94433 11223",
    address:"7, MG Road, Salem - 636001",
    item:"1x Leather Wallet & Belt Combo",
    price:1250,
    payment:"UPI (Refunded)"
}

];


let currentFilter="All";


/* DISPLAY */

function render(data){

    let box=document.getElementById("orders");

    if(data.length===0){

        box.innerHTML=
        `<div class="no-orders">
            No orders found.
        </div>`;

        return;
    }


    box.innerHTML=data.map(o=>{

        let buttons="";


        if(o.status==="Pending"){

            buttons=`
            <button class="btn blue"
            onclick="changeStatus('${o.id}','Confirmed')">
            Confirm Order →
            </button>

            <button class="btn gray"
            onclick="changeStatus('${o.id}','Cancelled')">
            Cancel
            </button>
            `;

        }


        if(o.status==="Confirmed"){

            buttons=`
            <button class="btn purple"
            onclick="changeStatus('${o.id}','Dispatched')">
            Dispatch Order 🚚
            </button>

            <button class="btn gray"
            onclick="changeStatus('${o.id}','Cancelled')">
            Cancel
            </button>
            `;

        }


        if(o.status==="Dispatched"){

            buttons=`
            <button class="btn green"
            onclick="changeStatus('${o.id}','Delivered')">
            Mark Delivered ✓
            </button>
            `;

        }


        return`

        <div class="order">

            <div class="order-top">

                <span class="order-id">
                    ${o.id}
                </span>

                <span class="status ${o.status}">
                    ${o.status}
                </span>

                <span class="time">
                    📅 ${o.time}
                </span>

            </div>


            <div class="buttons">

                ${buttons}

                <button class="btn black"
                onclick="viewDetails('${o.id}')">
                👁 View Details
                </button>

            </div>


            <div class="details"
            id="details-${o.id}">

                <div class="label">
                    CUSTOMER DETAILS
                </div>

                <div class="name">
                    ${o.name}
                </div>

                <div class="info">
                    ☎ ${o.phone}<br>
                    📍 ${o.address}
                </div>


                <div style="margin-top:22px">

                    <div class="label">
                        ITEMS ORDERED
                    </div>

                    <div class="item">

                        <span>
                            ${o.item}
                        </span>

                        <b>
                            ₹${o.price.toFixed(2)}
                        </b>

                    </div>

                </div>


                <div class="bill">

                    <div class="label">
                        TOTAL BILL
                    </div>

                    <div class="bill-price">
                        ₹${o.price.toFixed(2)}
                    </div>

                    <div>
                        ${o.payment}
                    </div>

                </div>

            </div>

        </div>

        `;

    }).join("");

}


/* FILTER */

function filterOrders(status,btn){

    currentFilter=status;

    document.querySelectorAll(".menu-btn")
    .forEach(b=>b.classList.remove("active"));

    btn.classList.add("active");

    searchOrders();
}


/* SEARCH */

function searchOrders(){

    let text=
        document.getElementById("search")
        .value
        .toLowerCase();


    let result=orders.filter(o=>{

        let filterOK=
            currentFilter==="All" ||
            o.status===currentFilter;

        let searchOK=
            o.id.toLowerCase().includes(text) ||
            o.name.toLowerCase().includes(text) ||
            o.phone.toLowerCase().includes(text);

        return filterOK && searchOK;

    });


    render(result);
}


/* DETAILS */

function viewDetails(id){

    let d=document.getElementById(
        "details-"+id
    );

    if(d.style.display==="none"){
        d.style.display="block";
    }
    else{
        d.style.display="none";
    }
}


/* STATUS CHANGE */

function changeStatus(id,status){

    let order=
        orders.find(o=>o.id===id);

    if(order){

        order.status=status;

        updateCounts();

        searchOrders();

    }
}


/* COUNTS */

function updateCounts(){

    document.getElementById("total")
        .innerText=orders.length;

    document.getElementById("pending")
        .innerText=
        orders.filter(
            o=>o.status==="Pending"
        ).length;

    document.getElementById("dispatched")
        .innerText=
        orders.filter(
            o=>o.status==="Dispatched"
        ).length;

    document.getElementById("delivered")
        .innerText=
        orders.filter(
            o=>o.status==="Delivered"
        ).length;
}


/* START */

render(orders);

updateCounts();

</script>

</body>
</html>
