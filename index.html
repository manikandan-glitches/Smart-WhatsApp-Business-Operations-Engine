<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Shopkeeper Hub</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            color: #1e293b;
        }

        /* SIDEBAR */

        .sidebar {
            position: fixed;
            left: 0;
            top: 0;
            width: 220px;
            height: 100vh;
            background: #0d172d;
            color: white;
            padding: 18px 12px;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 5px;
            margin-bottom: 25px;
        }

        .logo-icon {
            width: 38px;
            height: 38px;
            background: #2563eb;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }

        .logo-title {
            font-size: 15px;
            font-weight: bold;
        }

        .logo-subtitle {
            font-size: 10px;
            color: #94a3b8;
            margin-top: 3px;
        }

        .menu-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px 10px;
            margin: 5px 0;
            border-radius: 8px;
            color: #94a3b8;
            font-size: 12px;
            cursor: pointer;
        }

        .menu-item:hover {
            background: #17243d;
            color: white;
        }

        .menu-item.active {
            background: #2563eb;
            color: white;
        }

        .menu-icon {
            width: 20px;
            text-align: center;
        }

        .count {
            margin-left: auto;
            background: rgba(255,255,255,0.2);
            padding: 3px 7px;
            border-radius: 10px;
            font-size: 10px;
        }

        /* WHATSAPP */

        .whatsapp-box {
            position: absolute;
            left: 12px;
            right: 12px;
            bottom: 15px;
            padding: 12px;
            border-radius: 9px;
            background: #14213a;
        }

        .whatsapp-title {
            font-size: 10px;
            font-weight: bold;
        }

        .whatsapp-status {
            font-size: 9px;
            color: #94a3b8;
            margin-top: 4px;
        }

        .green-dot {
            display: inline-block;
            width: 7px;
            height: 7px;
            background: #22c55e;
            border-radius: 50%;
            margin-left: 5px;
        }

        /* MAIN */

        .main {
            margin-left: 220px;
            min-height: 100vh;
        }

        /* HEADER */

        .header {
            height: 60px;
            background: white;
            border-bottom: 1px solid #e5e7eb;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 25px;
        }

        .breadcrumb {
            font-size: 12px;
            color: #94a3b8;
        }

        .breadcrumb strong {
            color: #334155;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .sync {
            background: #eafaf1;
            color: #16a34a;
            padding: 7px 12px;
            border-radius: 15px;
            font-size: 10px;
        }

        .profile {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: #e0e7ff;
            color: #3730a3;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            font-weight: bold;
        }

        /* CONTENT */

        .content {
            padding: 25px;
        }

        /* SEARCH */

        .search-area {
            background: white;
            border-radius: 10px;
            padding: 12px;
            display: flex;
            gap: 10px;
            align-items: center;
            margin-bottom: 20px;
            border: 1px solid #edf0f4;
        }

        .search-box {
            flex: 1;
        }

        .search-box input {
            width: 100%;
            height: 38px;
            border: 1px solid #e2e8f0;
            border-radius: 7px;
            padding: 0 12px;
            outline: none;
            font-size: 12px;
        }

        .search-box input:focus {
            border-color: #2563eb;
        }

        .category-select {
            height: 38px;
            border: 1px solid #e2e8f0;
            border-radius: 7px;
            padding: 0 12px;
            background: white;
            outline: none;
        }

        .add-button {
            height: 38px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 7px;
            padding: 0 16px;
            cursor: pointer;
            font-size: 12px;
            font-weight: bold;
        }

        .add-button:hover {
            background: #1d4ed8;
        }

        /* PRODUCTS */

        .products {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 18px;
        }

        .card {
            background: white;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid #e5e7eb;
        }

        /* PRODUCT IMAGE */

        .product-image {
            height: 155px;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 75px;
        }

        .shoes {
            background: linear-gradient(135deg, #e11d48, #ef4444);
        }

        .phone {
            background: linear-gradient(135deg, #dbeafe, #94a3b8);
        }

        .earbuds {
            background: linear-gradient(135deg, #facc15, #f59e0b);
        }

        .clothing {
            background: linear-gradient(135deg, #cbd5e1, #64748b);
        }

        .wallet {
            background: linear-gradient(135deg, #334155, #475569);
        }

        .sneakers {
            background: linear-gradient(135deg, #fbcfe8, #bfdbfe);
        }

        .product-category {
            position: absolute;
            top: 10px;
            left: 10px;
            background: white;
            color: #334155;
            padding: 5px 8px;
            border-radius: 5px;
            font-size: 9px;
            font-weight: bold;
        }

        .discount {
            position: absolute;
            top: 10px;
            right: 10px;
            background: #2563eb;
            color: white;
            padding: 5px 8px;
            border-radius: 5px;
            font-size: 9px;
            font-weight: bold;
        }

        /* CARD BODY */

        .card-body {
            padding: 13px;
        }

        .card-title {
            margin: 0 0 6px;
            font-size: 13px;
            color: #1e293b;
        }

        .description {
            font-size: 9px;
            color: #94a3b8;
            line-height: 14px;
            min-height: 30px;
        }

        .details {
            display: flex;
            justify-content: space-between;
            margin-top: 12px;
        }

        .label {
            display: block;
            font-size: 8px;
            color: #94a3b8;
            text-transform: uppercase;
            margin-bottom: 4px;
        }

        .price {
            font-size: 14px;
            font-weight: bold;
        }

        /* STOCK */

        .stock {
            padding: 5px 8px;
            border-radius: 12px;
            font-size: 9px;
            font-weight: bold;
        }

        .in-stock {
            background: #eafaf1;
            color: #16a34a;
        }

        .out-stock {
            background: #fee2e2;
            color: #dc2626;
        }

        .low-stock {
            background: #fff7df;
            color: #d97706;
        }

        /* BUTTONS */

        .actions {
            display: flex;
            gap: 8px;
            margin-top: 13px;
        }

        .edit-button {
            flex: 1;
            height: 30px;
            border: 1px solid #e5e7eb;
            background: #f8fafc;
            border-radius: 6px;
            cursor: pointer;
            color: #475569;
        }

        .delete-button {
            width: 35px;
            height: 30px;
            border: 1px solid #e5e7eb;
            background: #f8fafc;
            border-radius: 6px;
            cursor: pointer;
            color: #64748b;
        }

        .edit-button:hover {
            color: #2563eb;
            background: #eff6ff;
        }

        .delete-button:hover {
            color: #dc2626;
            background: #fef2f2;
        }

        /* NO PRODUCTS */

        .no-products {
            grid-column: 1 / -1;
            background: white;
            padding: 50px;
            text-align: center;
            border-radius: 10px;
            color: #94a3b8;
        }

        /* MODAL */

        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.55);
            align-items: center;
            justify-content: center;
            z-index: 100;
        }

        .modal-box {
            width: 400px;
            max-width: 90%;
            background: white;
            border-radius: 12px;
            padding: 20px;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .modal-header h2 {
            margin: 0;
            font-size: 18px;
        }

        .close-button {
            border: none;
            background: none;
            font-size: 22px;
            cursor: pointer;
            color: #64748b;
        }

        .form-group {
            margin-bottom: 12px;
        }

        .form-group label {
            display: block;
            font-size: 11px;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            height: 38px;
            border: 1px solid #dbe2ea;
            border-radius: 6px;
            padding: 0 10px;
            outline: none;
        }

        .save-button {
            width: 100%;
            height: 40px;
            border: none;
            border-radius: 7px;
            background: #2563eb;
            color: white;
            cursor: pointer;
            font-weight: bold;
        }

        /* MOBILE */

        @media (max-width: 700px) {

            .sidebar {
                width: 65px;
                padding: 15px 8px;
            }

            .logo-title,
            .logo-subtitle,
            .menu-text,
            .whatsapp-box {
                display: none;
            }

            .logo {
                justify-content: center;
            }

            .menu-item {
                justify-content: center;
            }

            .count {
                display: none;
            }

            .main {
                margin-left: 65px;
            }

            .header {
                padding: 0 12px;
            }

            .sync {
                display: none;
            }

            .content {
                padding: 15px;
            }

            .search-area {
                flex-wrap: wrap;
            }

            .search-box {
                flex-basis: 100%;
            }

            .category-select,
            .add-button {
                flex: 1;
            }

            .products {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <!-- SIDEBAR -->

    <div class="sidebar">

        <div class="logo">

            <div class="logo-icon">🏪</div>

            <div>
                <div class="logo-title">Shopkeeper Hub</div>
                <div class="logo-subtitle">Inventory & Catalog</div>
            </div>

        </div>


        <div class="menu-item active">
            <span class="menu-icon">▣</span>
            <span class="menu-text">Products Catalog</span>
            <span class="count" id="productCount">6</span>
        </div>


        <div class="menu-item">
            <span class="menu-icon">▤</span>
            <span class="menu-text">Orders & Sales</span>
        </div>


        <div class="menu-item">
            <span class="menu-icon">▱</span>
            <span class="menu-text">WhatsApp Live Chats</span>
        </div>


        <div class="menu-item">
            <span class="menu-icon">⚙</span>
            <span class="menu-text">Store Settings</span>
        </div>


        <div class="whatsapp-box">

            <div class="whatsapp-title">
                WhatsApp Engine
                <span class="green-dot"></span>
            </div>

            <div class="whatsapp-status">
                Connected (+91 98765)
            </div>

        </div>

    </div>


    <!-- MAIN -->

    <div class="main">

        <!-- HEADER -->

        <div class="header">

            <div class="breadcrumb">
                Admin &nbsp;›&nbsp; <strong>Products</strong>
            </div>

            <div class="header-right">

                <div class="sync">
                    ● Auto-sync active with WhatsApp
                </div>

                <div class="profile">
                    SK
                </div>

            </div>

        </div>


        <!-- CONTENT -->

        <div class="content">

            <!-- SEARCH -->

            <div class="search-area">

                <div class="search-box">

                    <input
                        type="text"
                        id="search"
                        placeholder="Search product title, category, or description..."
                        oninput="showProducts()"
                    >

                </div>


                <select
                    class="category-select"
                    id="category"
                    onchange="showProducts()"
                >

                    <option value="All">All</option>
                    <option value="Shoes">Shoes</option>
                    <option value="Phones">Phones</option>
                    <option value="Electronics">Electronics</option>
                    <option value="Clothing">Clothing</option>
                    <option value="Accessories">Accessories</option>

                </select>


                <button
                    class="add-button"
                    onclick="openAddProduct()"
                >
                    + Add Product
                </button>

            </div>


            <!-- PRODUCTS -->

            <div
                class="products"
                id="products"
            ></div>

        </div>

    </div>


    <!-- MODAL -->

    <div
        class="modal"
        id="modal"
    >

        <div class="modal-box">

            <div class="modal-header">

                <h2 id="modalTitle">
                    Add Product
                </h2>

                <button
                    class="close-button"
                    onclick="closeModal()"
                >
                    ×
                </button>

            </div>


            <div class="form-group">

                <label>Product Name</label>

                <input
                    type="text"
                    id="productName"
                    placeholder="Enter product name"
                >

            </div>


            <div class="form-group">

                <label>Category</label>

                <select id="productCategory">

                    <option value="Shoes">Shoes</option>
                    <option value="Phones">Phones</option>
                    <option value="Electronics">Electronics</option>
                    <option value="Clothing">Clothing</option>
                    <option value="Accessories">Accessories</option>

                </select>

            </div>


            <div class="form-group">

                <label>Price</label>

                <input
                    type="number"
                    id="productPrice"
                    placeholder="Enter price"
                >

            </div>


            <div class="form-group">

                <label>Stock</label>

                <input
                    type="number"
                    id="productStock"
                    placeholder="Enter stock"
                >

            </div>


            <div class="form-group">

                <label>Description</label>

                <input
                    type="text"
                    id="productDescription"
                    placeholder="Enter description"
                >

            </div>


            <button
                class="save-button"
                onclick="saveProduct()"
            >
                Save Product
            </button>

        </div>

    </div>


    <script>

        /* PRODUCT DATA */

        let products = [

            {
                id: 1,
                name: "Nike Air Max Running Shoes",
                category: "Shoes",
                price: 3499,
                stock: 18,
                discount: "10% OFF",
                description: "Comfortable cushion running shoes, ideal for daily wear and athletics.",
                icon: "👟",
                imageClass: "shoes"
            },

            {
                id: 2,
                name: "Samsung Galaxy M34 5G",
                category: "Phones",
                price: 16999,
                stock: 8,
                discount: "5% OFF",
                description: "50MP camera, 6000 mAh battery, FHD+ Super AMOLED display.",
                icon: "📱",
                imageClass: "phone"
            },

            {
                id: 3,
                name: "Wireless Bluetooth Earbuds",
                category: "Electronics",
                price: 1899,
                stock: 0,
                discount: "15% OFF",
                description: "Deep noise cancellation with up to 30 hours of total playback.",
                icon: "🎧",
                imageClass: "earbuds"
            },

            {
                id: 4,
                name: "Classic Denim Jacket - Blue",
                category: "Clothing",
                price: 2199,
                stock: 12,
                discount: "",
                description: "100% Cotton durable denim jacket with sleek metal buttons.",
                icon: "🧥",
                imageClass: "clothing"
            },

            {
                id: 5,
                name: "Leather Executive Wallet",
                category: "Accessories",
                price: 799,
                stock: 25,
                discount: "20% OFF",
                description: "Genuine slim leather wallet with RFID blocking capability.",
                icon: "👛",
                imageClass: "wallet"
            },

            {
                id: 6,
                name: "Puma Sports Sneakers",
                category: "Shoes",
                price: 2899,
                stock: 3,
                discount: "",
                description: "Lightweight breathable mesh upper for maximum athletic comfort.",
                icon: "👟",
                imageClass: "sneakers"
            }

        ];


        let nextId = 7;

        let editId = null;


        /* SHOW PRODUCTS */

        function showProducts() {

            const container =
                document.getElementById("products");

            const search =
                document.getElementById("search")
                    .value
                    .toLowerCase();

            const category =
                document.getElementById("category")
                    .value;


            container.innerHTML = "";


            const filtered =
                products.filter(function(product) {

                    const searchMatch =
                        product.name.toLowerCase().includes(search) ||
                        product.category.toLowerCase().includes(search) ||
                        product.description.toLowerCase().includes(search);

                    const categoryMatch =
                        category === "All" ||
                        product.category === category;

                    return searchMatch && categoryMatch;

                });


            if (filtered.length === 0) {

                container.innerHTML =
                    '<div class="no-products">No products found</div>';

                return;
            }


            filtered.forEach(function(product) {

                let stockClass;
                let stockText;


                if (product.stock === 0) {

                    stockClass = "out-stock";
                    stockText = "● Out of Stock";

                } else if (product.stock <= 5) {

                    stockClass = "low-stock";
                    stockText = "● Only " + product.stock + " left";

                } else {

                    stockClass = "in-stock";
                    stockText = "● " + product.stock + " In Stock";

                }


                const card =
                    document.createElement("div");

                card.className = "card";


                card.innerHTML = `

                    <div class="product-image ${product.imageClass}">

                        <span style="font-size:75px;">
                            ${product.icon}
                        </span>

                        <span class="product-category">
                            ${product.category}
                        </span>

                        ${
                            product.discount
                            ? `<span class="discount">
                                ${product.discount}
                               </span>`
                            : ""
                        }

                    </div>


                    <div class="card-body">

                        <h3 class="card-title">
                            ${product.name}
                        </h3>

                        <div class="description">
                            ${product.description}
                        </div>


                        <div class="details">

                            <div>

                                <span class="label">
                                    Price
                                </span>

                                <span class="price">
                                    ₹${product.price.toLocaleString("en-IN")}
                                </span>

                            </div>


                            <div>

                                <span class="label">
                                    Stock Status
                                </span>

                                <span class="stock ${stockClass}">
                                    ${stockText}
                                </span>

                            </div>

                        </div>


                        <div class="actions">

                            <button
                                class="edit-button"
                                onclick="editProduct(${product.id})"
                            >
                                ✎ Edit
                            </button>

                            <button
                                class="delete-button"
                                onclick="deleteProduct(${product.id})"
                            >
                                🗑
                            </button>

                        </div>

                    </div>
                `;


                container.appendChild(card);

            });


            document.getElementById("productCount")
                .textContent = products.length;

        }


        /* OPEN ADD PRODUCT */

        function openAddProduct() {

            editId = null;

            document.getElementById("modalTitle")
                .textContent = "Add Product";

            document.getElementById("productName")
                .value = "";

            document.getElementById("productPrice")
                .value = "";

            document.getElementById("productStock")
                .value = "";

            document.getElementById("productDescription")
                .value = "";

            document.getElementById("modal")
                .style.display = "flex";

        }


        /* EDIT PRODUCT */

        function editProduct(id) {

            const product =
                products.find(function(item) {
                    return item.id === id;
                });


            if (!product) {
                return;
            }


            editId = id;


            document.getElementById("modalTitle")
                .textContent = "Edit Product";

            document.getElementById("productName")
                .value = product.name;

            document.getElementById("productCategory")
                .value = product.category;

            document.getElementById("productPrice")
                .value = product.price;

            document.getElementById("productStock")
                .value = product.stock;

            document.getElementById("productDescription")
                .value = product.description;

            document.getElementById("modal")
                .style.display = "flex";

        }


        /* SAVE PRODUCT */

        function saveProduct() {

            const name =
                document.getElementById("productName")
                    .value.trim();

            const category =
                document.getElementById("productCategory")
                    .value;

            const price =
                Number(
                    document.getElementById("productPrice")
                        .value
                );

            const stock =
                Number(
                    document.getElementById("productStock")
                        .value
                );

            const description =
                document.getElementById("productDescription")
                    .value.trim();


            if (name === "") {

                alert("Please enter product name.");

                return;
            }


            if (isNaN(price) || price < 0) {

                alert("Please enter a valid price.");

                return;
            }


            if (isNaN(stock) || stock < 0) {

                alert("Please enter a valid stock.");

                return;
            }


            if (editId === null) {

                products.push({

                    id: nextId,

                    name: name,

                    category: category,

                    price: price,

                    stock: stock,

                    discount: "",

                    description:
                        description || "Quality product",

                    icon: "📦",

                    imageClass: "phone"

                });

                nextId++;

            } else {

                const product =
                    products.find(function(item) {
                        return item.id === editId;
                    });


                if (product) {

                    product.name = name;
                    product.category = category;
                    product.price = price;
                    product.stock = stock;

                    if (description !== "") {
                        product.description = description;
                    }

                }

            }


            closeModal();

            showProducts();

        }


        /* DELETE */

        function deleteProduct(id) {

            const answer =
                confirm("Are you sure you want to delete this product?");


            if (!answer) {
                return;
            }


            products =
                products.filter(function(product) {
                    return product.id !== id;
                });


            showProducts();

        }


        /* CLOSE MODAL */

        function closeModal() {

            document.getElementById("modal")
                .style.display = "none";

        }


        /* INITIAL DISPLAY */

        showProducts();

    </script>

</body>
</html>
